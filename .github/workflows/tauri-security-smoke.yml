name: Tauri security smoke
on:
  push:
    branches: [codex/tauri-security-smoke-20261104]
permissions:
  contents: read
jobs:
  smoke:
    name: Tauri executable and launch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xdotool imagemagick
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix desktop ci
      - name: Build unsigned executable with embedded frontend
        run: |
          npm run build
          cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Launch Linux executable and capture native window
        if: runner.os == 'Linux'
        run: |
          mkdir -p smoke
          timeout 75s xvfb-run -a bash -euo pipefail -c '
            desktop/src-tauri/target/debug/draftharbour_desktop >smoke/linux.log 2>&1 &
            app=$!
            trap "kill $app 2>/dev/null || true" EXIT
            window=""
            for attempt in $(seq 1 30); do
              kill -0 "$app"
              window=$(xdotool search --onlyvisible --name "^DraftHarbour Studio$" | head -1 || true)
              if test -n "$window"; then break; fi
              sleep 1
            done
            test -n "$window"
            sleep 5
            kill -0 "$app"
            import -window "$window" smoke/linux.png
            echo "Found visible DraftHarbour Studio window and a live Tauri process."
          '
      - name: Launch Windows executable and capture native window
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory smoke | Out-Null
          $process = Start-Process -FilePath ./desktop/src-tauri/target/debug/draftharbour_desktop.exe -PassThru -RedirectStandardOutput smoke/windows.log -RedirectStandardError smoke/windows-error.log
          try {
            for ($attempt = 0; $attempt -lt 35; $attempt++) {
              $process.Refresh()
              if ($process.HasExited) { throw "Tauri exited with code $($process.ExitCode)" }
              if ($process.MainWindowTitle -eq 'DraftHarbour Studio' -and $process.MainWindowHandle -ne 0) { break }
              Start-Sleep -Seconds 1
            }
            if ($process.MainWindowTitle -ne 'DraftHarbour Studio') { throw 'Native Tauri window did not become ready.' }
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw "Tauri exited with code $($process.ExitCode)" }
            Write-Host "Found live process $($process.Id) with window $($process.MainWindowTitle)."
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $image = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($image)
            try {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $image.Save((Join-Path $PWD 'smoke/windows.png'))
            } finally {
              $graphics.Dispose()
              $image.Dispose()
            }
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: smoke
          if-no-files-found: ignore
          retention-days: 3
